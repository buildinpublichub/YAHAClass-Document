<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="stage-size" content="__SIZE__">
<title>__TITLE__ · 成片</title>
<style>
__FONTS__
/* ===== 预览外壳（只在浏览器预览时出现；渲染时隐藏） ===== */
:root{--ui-bg:#0b0b0b;--ui-panel:#161616;--ui-line:#2a2d33;--ui-text:#eeeeea;--ui-muted:#8b929c;--ui-acc:#d87756}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ui-bg);color:var(--ui-text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.shell{max-width:1280px;margin:0 auto;padding:14px 16px 28px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.btn{border:1px solid var(--ui-line);background:var(--ui-panel);color:var(--ui-text);border-radius:8px;padding:7px 13px;font:inherit;cursor:pointer}
.btn:hover{border-color:var(--ui-muted)}
.btn.pri{background:var(--ui-acc);border-color:var(--ui-acc);color:#111;font-weight:600}
.sp{flex:1}
.info{font-variant-numeric:tabular-nums;color:var(--ui-muted)}
.info b{color:var(--ui-text);font-weight:600}
.wrap{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:10px;border:1px solid var(--ui-line);background:#000}
body.portrait .wrap{aspect-ratio:9/16;max-width:calc(78vh * 9 / 16);margin:0 auto}
body.portrait.bare .wrap{max-width:none;margin:0}
.tl{position:relative;height:24px;margin-top:10px;display:flex;border-radius:5px;overflow:hidden;cursor:pointer}
.tl span{height:100%;border-right:1px solid var(--ui-bg);background:#23262b}
.tl span.alt{background:#2c3036}
.tl span.miss{background:#5a2a33}
.tl span.cur{background:var(--ui-acc)!important}
.tl i{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none}
.sub{margin-top:8px;padding:9px 14px;background:var(--ui-panel);border:1px solid var(--ui-line);border-radius:8px;min-height:42px;font-size:15px}
.sub small{color:var(--ui-muted);margin-right:8px;font-variant-numeric:tabular-nums}
.sub .prop{display:block;color:var(--ui-muted);font-size:13px;margin-top:4px}
.help{color:var(--ui-muted);font-size:12px;margin-top:8px}
kbd{border:1px solid var(--ui-line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font:12px ui-monospace,Menlo,monospace;background:var(--ui-panel)}
@media (max-width:700px){.shell{padding:12px 16px}}
body.bare .bar,body.bare .tl,body.bare .sub,body.bare .help{display:none}
body.bare .shell{max-width:none;padding:0}body.bare .wrap{border:0;border-radius:0}

/* ===== 舞台：暗色示意风格（规范 v2 第 4 节） ===== */
.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  --bg:#0d0d0d;--win:#1d2025;--winbar:#181a1e;--card:#2c3139;--card2:#23272d;--edge:#454b54;
  --l1:#9aa2ad;--l2:#646c76;--or:#d87756;--tx:#f2f2ee;--mut:#aab1ba;--ok:#a6c985;--err:#dd6b80;--warn:#e3b341;
  --pink:#d87756;--yellow:#e3b341;--blue:#9fb4cf;--teal:#a6c985;--red:#dd6b80;--agent:#d87756;--person-ic:#9fb4cf;--gtrack:#4a5059;
  background:var(--bg);color:var(--tx);font-family:"NSC",sans-serif;font-size:26px;line-height:1.35}
.stage.v{width:1080px;height:1920px}
.scr{position:absolute;inset:0}
.a{position:absolute}
.stage svg{overflow:visible}
/* 容器 */
.card{background:var(--card);border:1px solid var(--edge);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.win{background:var(--win);border:1px solid var(--edge);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.45);overflow:hidden}
.win>.wbar{height:54px;background:var(--winbar);border-bottom:1px solid var(--edge);display:flex;align-items:center;gap:10px;padding:0 20px;font:500 28px/1 "NSC";color:var(--mut)}
.win>.wbar i{width:14px;height:14px;border-radius:50%;background:#3a3d42;flex:none}
.win>.wbar i:nth-child(1){background:#ff5f57}.win>.wbar i:nth-child(2){background:#febc2e}.win>.wbar i:nth-child(3){background:#28c840}
.win>.wbar b{flex:1;text-align:center;font-weight:500;margin-right:72px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win>.wbody{position:absolute;left:0;right:0;top:54px;bottom:0}
.chead{display:flex;align-items:center;gap:14px;font:600 32px/1.2 "NSC";color:var(--tx)}
.chead svg{width:1.05em;height:1.05em;flex:none}
/* 胶囊与标签 */
.pill{display:inline-flex;align-items:center;gap:.36em;white-space:nowrap;background:var(--card);border:1px solid var(--edge);border-radius:999px;padding:.36em .72em;font:500 32px/1 "NSC";color:var(--tx)}
.pill svg{width:1em;height:1em;flex:none}
.pill.or{background:rgba(216,119,86,.16);border-color:rgba(216,119,86,.55);color:#f0a98f}
.pill.ok{background:rgba(166,201,133,.13);border-color:rgba(166,201,133,.5);color:var(--ok)}
.pill.err{background:rgba(221,107,128,.14);border-color:rgba(221,107,128,.55);color:var(--err)}
.pill.warn{background:rgba(227,179,65,.13);border-color:rgba(227,179,65,.5);color:var(--warn)}
.pill.mut{color:var(--mut)}
.lbl{font:500 26px/1.2 "NSC";color:var(--mut);white-space:nowrap}
.lbl.tx{color:var(--tx)}
.big{font:600 64px/1 "NSC";font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mono{font-family:"JBM",monospace}
/* 骨架横条 */
.sk{height:12px;border-radius:6px;background:var(--l2)}
.sk.l1{background:var(--l1)}.sk.or{background:var(--or)}.sk.ok{background:var(--ok)}.sk.err{background:var(--err)}.sk.warn{background:var(--warn)}
/* 风格化终端 */
.term .wbody{padding:22px 28px;font:400 26px/1.7 "JBM",monospace;color:var(--tx)}
.term .ln{white-space:pre;overflow:hidden}
.term .ln .p{color:var(--mut)}.term .ln .o{color:var(--or)}.term .ln .g{color:var(--ok)}.term .ln .r{color:var(--err)}.term .ln .m{color:var(--mut)}
.caret{display:inline-block;width:.55em;height:1.05em;background:var(--tx);vertical-align:-.18em}
/* 图标与状态徽标 */
.ico{display:grid;place-items:center}
.ico svg{width:100%;height:100%}
.badge{border-radius:50%;display:grid;place-items:center;border:2px solid var(--l2);background:var(--card)}
.badge svg{width:100%;height:100%}
.badge.ok{background:var(--ok);border-color:var(--ok)}.badge.err{background:var(--err);border-color:var(--err)}
.badge.warn{background:transparent;border:0}.badge.or{background:var(--or);border-color:var(--or)}
.badge.idle{background:transparent}
/* 代理与人 */
.agent{border-radius:16px;background:var(--card);border:1px solid var(--edge);display:grid;place-items:center}
.agent svg{width:58%;height:58%}
.agent.bare{background:transparent;border:0}
.person{border-radius:50%;background:#2c3a4d;border:2px solid #45576f;display:grid;place-items:center}
.person>span{width:56%;height:56%}
.person svg{width:100%;height:100%}
/* 容量条、进度条 */
.meter{background:#15171a;border:1px solid var(--edge);border-radius:999px;overflow:hidden}
.meter>i{display:block;height:100%;width:0;background:var(--l1);border-radius:999px}
/* 焦点：被降暗 / 模糊的元素 */
.hl{outline:2px solid var(--or);outline-offset:4px}
/* 流程节点 */
.node{border-radius:16px;background:var(--card);border:1px solid var(--edge);display:grid;place-items:center;color:var(--mut)}
.node svg{width:46%;height:46%}
/* 章节进度条 */
.chap{height:8px;border-radius:4px;background:var(--l2);overflow:hidden}
.chap>i{display:block;height:100%;width:0;background:var(--or)}

/* ===== 亮色主题（Gumroad 官网风格）：build_film.py --theme light 时 .stage 加 .light =====
   米白底、纯黑粗描边、硬投影、粉色 = 当前（色块用 --pink，线条 / 文字用深一档的 --or），平涂色块，不用渐变、发光、模糊阴影 */
.stage.light{--bg:#f4f4f0;--win:#ffffff;--winbar:#ffffff;--card:#ffffff;--card2:#e4e4dc;--edge:#000000;
  --l1:#242423;--l2:#b8b8b0;--or:#e84fc8;--tx:#000000;--mut:#3d3d3a;--ok:#23a094;--err:#dc341e;--warn:#ffc900;
  --pink:#ff90e8;--yellow:#ffc900;--blue:#90a8ed;--teal:#23a094;--red:#dc341e;--agent:#000000;--person-ic:#000000;--gtrack:#d6d6ce}
.stage.light::before{content:"";position:absolute;right:-170px;bottom:-190px;width:480px;height:480px;border-radius:50%;background:var(--yellow);border:4px solid #000}
.stage.light::after{content:"";position:absolute;right:250px;bottom:40px;width:74px;height:74px;border-radius:50%;background:var(--pink);border:4px solid #000}
.stage.light.v::before{right:-150px;top:-170px;bottom:auto}.stage.light.v::after{right:230px;top:60px;bottom:auto}
.stage.light .scr{z-index:1}
.stage.light .card{border:3px solid #000;border-radius:14px;box-shadow:6px 6px 0 #000}
.stage.light .win{border:3px solid #000;border-radius:14px;box-shadow:8px 8px 0 #000}
.stage.light .win>.wbar{border-bottom:3px solid #000;color:#000;font-weight:700}
.stage.light .win>.wbar i{border:2px solid #000}
.stage.light .win>.wbar i:nth-child(1){background:var(--pink)}.stage.light .win>.wbar i:nth-child(2){background:var(--yellow)}.stage.light .win>.wbar i:nth-child(3){background:var(--blue)}
.stage.light .chead{font-weight:800;color:#000}
.stage.light .pill{background:#fff;border:3px solid #000;color:#000;font-weight:700}
.stage.light .pill.or{background:var(--pink);border-color:#000;color:#000}
.stage.light .pill.ok{background:var(--teal);border-color:#000;color:#fff}
.stage.light .pill.err{background:var(--red);border-color:#000;color:#fff}
.stage.light .pill.warn{background:var(--yellow);border-color:#000;color:#000}
.stage.light .pill.mut{background:#fff;color:#3d3d3a}
.stage.light .lbl{color:#3d3d3a;font-weight:600}.stage.light .lbl.tx{color:#000;font-weight:700}
.stage.light .big{font-weight:800}
.stage.light .caret{background:#000}
.stage.light .badge{border:3px solid #000;background:#fff}
.stage.light .badge.ok{background:var(--teal);border-color:#000}.stage.light .badge.err{background:var(--red);border-color:#000}.stage.light .badge.or{background:var(--pink);border-color:#000}
.stage.light .badge.warn{border:0;background:transparent}.stage.light .badge.idle{background:#fff}
.stage.light .agent{border:3px solid #000;box-shadow:4px 4px 0 #000}.stage.light .agent.bare{border:0;box-shadow:none}
.stage.light .person{background:var(--blue);border:3px solid #000}
.stage.light .meter{background:#fff;border:3px solid #000}
.stage.light .node{border:3px solid #000;box-shadow:5px 5px 0 #000;color:#000}
.stage.light .chap>i{background:var(--pink)}
.stage.light .hl{outline:3px solid #000}
</style>
</head>
<body>
<div class="shell">
  <div class="bar">
    <button class="btn pri" id="play">▶ 播放</button>
    <button class="btn" id="prev">← 上一场景</button>
    <button class="btn" id="next">下一场景 →</button>
    <button class="btn" id="rep">↺ 本场景</button>
    <span class="info" id="info"></span>
    <span class="sp"></span>
  </div>
  <div class="wrap" id="wrap"><div class="stage" id="stage"></div></div>
  <div class="tl" id="tl"><i id="ph"></i></div>
  <div class="sub" id="sub"></div>
  <div class="help"><kbd>空格</kbd> 播放/暂停　<kbd>←</kbd><kbd>→</kbd> 上一/下一场景　<kbd>R</kbd> 重播本场景　点时间轴可跳转。下方旁白与视觉命题只用于预览审阅，不会进入成片。</div>
</div>
<audio id="au" src="__AUDIO__" preload="none"></audio>
<script>
const D=__DATA__;
/* ===== 画布 ===== */
const V=D.aspect==="9:16",VW=V?1080:1920,VH=V?1920:1080,LIGHT=D.theme==="light";
// 安全区：横版四周留边；竖版上方留平台顶栏、下方和右侧留标题/评论按钮
const SAFE=V?{x0:90,x1:970,y0:280,y1:1520}:{x0:120,x1:1800,y0:90,y1:990};
const CX=V?530:960,CY=V?900:540;

/* ===== 时间工具：画面完全由时间 t 算出，可任意跳转、逐帧一致 ===== */
const LEAD=0.2,TOTAL=D.total;
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,s,d)=>d<=0?(t>=s?1:0):cl((t-s)/d);
const lerp=(a,b,p)=>a+(b-a)*p;
const eo=x=>1-Math.pow(1-x,3);                                    // 减速
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;                 // 先加速后减速
const es=x=>{const c1=1.1,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}; // 轻微回弹（克制）
const S=(n,dt=0)=>D.subs[n][0]+dt;                                 // 第 n 句字幕开始（dt 为句内偏移秒数）
const SE=n=>D.subs[n][1];                                          // 第 n 句字幕结束
const N=n=>Math.round(n).toLocaleString("en-US");
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
// 时间段内的逐项时刻：从 s 开始，每项间隔 gap
const stagger=(s,i,gap=.18)=>s+i*gap;

/* ===== 元素 ===== */
const px=v=>typeof v==="number"?v+"px":v;
function E(p,cls="",html="",css){const e=document.createElement("div");if(cls)e.className=cls;if(html)e.innerHTML=html;if(css)Object.assign(e.style,css);p.appendChild(e);return e}
// 绝对定位元素：pos 里数字自动加 px（无单位的值写成字符串，如 opacity:"0"）
function box(p,cls,html,pos={}){const e=E(p,"a "+cls,html);const m={x:"left",y:"top",w:"width",h:"height"};for(const k in pos)e.style[m[k]||k]=px(pos[k]);return e}
const NS="http://www.w3.org/2000/svg";
function sv(p,tag,at={}){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);p.appendChild(e);return e}
function svgRoot(p){return sv(p,"svg",{width:VW,height:VH,style:"position:absolute;left:0;top:0;overflow:visible"})}

/* ===== 图标（线性，stroke=currentColor） ===== */
const IC={
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',cross:'<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
  warn:'<path d="M12 3.5l9.5 16.5h-19z" fill="currentColor" stroke="none"/><path d="M12 10v4.5M12 17.3v.2" stroke="#111" stroke-width="2.4"/>',
  q:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.6 2.6 0 015 1c0 1.8-2.5 2-2.5 3.6M12 17.2v.2"/>',
  lock:'<rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 018 0v2.5"/>',
  unlock:'<rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 017.5-1.9"/>',
  doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',folder:'<path d="M3 6.5h6l2 2h10v10.5H3z"/>',
  code:'<path d="M8.5 7L3.5 12l5 5M15.5 7l5 5-5 5"/>',eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  user:'<circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20.5c1.2-4 4.2-5.8 7.5-5.8s6.3 1.8 7.5 5.8"/>',
  users:'<circle cx="9" cy="9" r="3.2"/><path d="M3 19.5c.9-3.3 3.3-4.8 6-4.8s5.1 1.5 6 4.8"/><circle cx="16.5" cy="8" r="2.7"/><path d="M16 13.3c2.4 0 4.3 1.3 5 4"/>',
  search:'<circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5.5 5.5"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5.5l3.5 2"/>',
  db:'<ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"/><path d="M4.5 5.5v13c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8v-13M4.5 12c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8"/>',
  chat:'<path d="M4 5h16v11H9l-5 4z"/>',list:'<path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.5" cy="6.5" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="17.5" r="1"/>',
  shield:'<path d="M12 3l7.5 3v6c0 4.5-3.2 7.7-7.5 9-4.3-1.3-7.5-4.5-7.5-9V6z"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/>',
  key:'<circle cx="8" cy="15" r="4.2"/><path d="M11 12l8.5-8.5M16.5 6.5l2.5 2.5M14 9l2 2"/>',box:'<path d="M12 2.5l8.5 4.7v9.6L12 21.5l-8.5-4.7V7.2z"/><path d="M3.5 7.2L12 12l8.5-4.8M12 12v9.5"/>',
  bolt:'<path d="M13 2.5L5 13.5h6l-1 8 8-11h-6z"/>',play:'<path d="M7 4.5v15l12-7.5z"/>',stop:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
  arrow:'<path d="M4 12h15M13.5 6.5L19 12l-5.5 5.5"/>',plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',
  phone:'<rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.5 18.5h3"/>',monitor:'<rect x="2.5" y="4" width="19" height="13" rx="1.5"/><path d="M8.5 21h7M12 17v4"/>',
  refresh:'<path d="M20 11a8 8 0 10-2.3 6.1M20 4.5V11h-6.5"/>',crown:'<path d="M3.5 8l4.5 4 4-6.5 4 6.5 4.5-4-2 10.5h-13z"/>',
  hand:'<path d="M8 12.5V5.5a1.5 1.5 0 013 0V11M11 10.5V4a1.5 1.5 0 013 0v7M14 10.5V5.5a1.5 1.5 0 013 0v8c0 4.2-2.7 7-6.5 7-2.8 0-4.3-1.4-5.7-4L3.5 13a1.5 1.5 0 012.5-1.6L8 13.5"/>',
  mail:'<rect x="3" y="5.5" width="18" height="13" rx="1.5"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/>',cart:'<path d="M3 4h2.5l2.2 11h10.8l2-8H7"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/>',
  coin:'<circle cx="12" cy="12" r="9"/><path d="M14.8 8.8c-.6-.9-1.7-1.4-2.8-1.4-1.6 0-2.9.9-2.9 2.2 0 3.2 6 1.6 6 4.8 0 1.3-1.3 2.3-3 2.3-1.3 0-2.5-.6-3.1-1.6M12 5.5v1.9M12 16.7v1.8"/>',
  book:'<path d="M4 4.5h6.5a2 2 0 012 2V20a1.8 1.8 0 00-1.8-1.8H4zM20 4.5h-6.5a2 2 0 00-2 2V20a1.8 1.8 0 011.8-1.8H20z"/>',
  cal:'<rect x="3.5" y="5" width="17" height="15.5" rx="1.8"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/>',flag:'<path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>'};

  return c}
// 胶囊：tone = or/ok/err/warn/mut；icon 可选；size 字号（默认 32）；w 定宽（文字居中）
function pill(p,text,o={}){const e=box(p,"pill"+(o.tone?" "+o.tone:""),(o.icon?ico(o.icon):"")+`<span>${esc(text)}</span>`,{x:o.x,y:o.y});if(o.size)e.style.fontSize=px(o.size);if(o.w){e.style.width=px(o.w);e.style.justifyContent="center"}return e}

function win(p,o={}){const w=box(p,"win","",{x:o.x,y:o.y,w:o.w||640,h:o.h||400});E(w,"wbar",`<i></i><i></i><i></i><b>${esc(o.title||"")}</b>`);w.body=E(w,"wbody");return w}

// 不透明着色：tone 按 amt 比例混进卡片底色（高亮压在连线上时不会透出底下的线）；amt=0 恢复

// 流程节点：圆角方块 + 图标 + 下方标签；setNode(n, state) state = idle / active（橙）/ ok / err / warn / dim
function node(p,o={}){const s=o.s||110,n=box(p,"node",o.icon?ico(o.icon):(o.text?`<span style="font:600 ${Math.round(s*.34)}px/1 NSC">${esc(o.text)}</span>`:""),{x:o.x,y:o.y,w:s,h:s});if(o.round)n.style.borderRadius="50%";

// 额度条 + 上限竖线：setQuota(q, 0–1+, tone)；超过 1 时条被截在上限处并变红
function quota(p,o={}){const w=o.w||420,h=o.h||16,q=box(p,"","",{x:o.x,y:o.y,w:w+20,h:h+(o.label?40:0)});

// 分段柱 / 分段条：n 段，返回段数组；每段用 grow() 或 A() 控制出现，tint() 着色
function stack(p,o={}){const n=o.n||4,g=o.gap??4,out=[];for(let i=0;i<n;i++){const e=o.vertical?box(p,"card","",{x:o.x,y:o.y+o.h-(i+1)*(o.h/n),w:o.w,h:o.h/n-g}):box(p,"card","",{x:o.x+i*(o.w/n),y:o.y,w:o.w/n-g,h:o.h});e.style.borderRadius="6px";e.style.boxShadow="none";out.push(e)}return out}

function chapters(p,o={}){const n=o.n||3,w=o.w||900,g=10,sw=(w-g*(n-1))/n,c=box(p,"","",{x:o.x,y:o.y,w,h:40});c.segs=[];

const centered=e=>{e.style.transform="translate(-50%,-50%)";return e};
// 确定性伪随机：同一 seed 永远得到同样的序列（画面必须逐帧一致，不能用 Math.random）
const rnd=seed=>()=>((seed=(seed*16807)%2147483647)-1)/2147483646;
// 追加 CSS（覆盖或补充样式时用；同一段只加一次）
function addCSS(css){const k="css"+css.length+css.slice(0,40);if(document.getElementById(k))return;const e=document.createElement("style");e.id=k;e.textContent=css;document.head.appendChild(e)}

/* ===== 动画（规范第 7 节）：都只由 t 决定，不累积状态 ===== */
// 进场：k = rise（默认，上浮）/ fade / left / right / drop（从上落下）/ pop（轻微放大，克制）/ none
// s 为字幕时间（用 S(n)），自动提前 LEAD 秒，说到这句时刚好到位。返回进度 0–1
function A(el,t,s,o={}){const k=o.k||"rise",d=o.d||(k==="pop"?.45:.5),p=P(t,s-LEAD,d),e=k==="pop"?es(p):eo(p);
  const m=o.dist||36;let dx=0,dy=0,sc=1;
  if(k==="rise")dy=m*(1-e);else if(k==="left")dx=-m*1.6*(1-e);else if(k==="right")dx=m*1.6*(1-e);else if(k==="drop")dy=-m*1.6*(1-e);else if(k==="pop")sc=.9+.1*e;
  setFx(el,{op:k==="none"?(p>0?1:0):cl(k==="pop"?p*2.2:e),dx,dy,sc});return p}
// 退场：k = fade（默认）/ fall（掉落并变暗：表示被丢弃、遗漏）/ shrink
function X(el,t,s,o={}){const k=o.k||"fade",d=o.d||.45,p=eio(P(t,s-LEAD,d));if(p<=0)return 0;
  if(k==="fall")setFx(el,{op2:1-p*.75,fy:160*p*p,rot:(o.rot||8)*p,dim:.6*p});
  else if(k==="shrink")setFx(el,{op2:1-p,sc2:1-.4*p});
  else setFx(el,{op2:1-p});return p}
// 降暗（退出焦点、被遗忘、看不到）：to 为最终亮度比例，默认 .35；back 为恢复亮度的时刻（可选）
function dim(el,t,s,o={}){let p=eio(P(t,s-LEAD,o.d||.5));if(o.back!=null)p*=1-eio(P(t,o.back-LEAD,o.d||.4));setFx(el,{dim:(1-(o.to??.35))*p});return p}
// 模糊 ↔ 清晰：from/to 为模糊像素
function blur(el,t,s,o={}){const p=eio(P(t,s-LEAD,o.d||.5));setFx(el,{blur:lerp(o.from??8,o.to??0,p)});return p}
// 移动：从 [x0,y0] 到 [x1,y1]（相对原位置的偏移），返回进度
function mv(el,t,s,o={}){const p=eio(P(t,s-LEAD,o.d||.6)),f=o.from||[0,0],to=o.to||[0,0];setFx(el,{mx:lerp(f[0],to[0],p),my:lerp(f[1],to[1],p)});return p}
// 缩放强调：到 to 倍
function zoom(el,t,s,o={}){const p=eio(P(t,s-LEAD,o.d||.5));setFx(el,{sc2:lerp(o.from??1,o.to??1.08,p)});return p}
// 所有效果合成到 opacity / translate / scale / rotate / filter，互不覆盖
const FX0={op:1,op2:1,dx:0,dy:0,mx:0,my:0,fy:0,sc:1,sc2:1,rot:0,dim:0,blur:0,gx:1,gy:1,gxr:0};
function setFx(el,o){const f=el._fx||(el._fx={...FX0});Object.assign(f,o);
  // 「还没讲到 / 等待出场」= 50% 透明度，不用模糊滤镜（用户要求：模糊看着像失焦的截图）。blur 数值只折算成透明度：≥4px 即 50%
  const bw=cl(f.blur/4);el.style.opacity=cl(f.op*f.op2*(1-.5*bw));el.style.translate=`${f.dx+f.mx}px ${f.dy+f.my+f.fy}px`;el.style.scale=String(f.sc*f.sc2);el.style.rotate=f.rot+"deg";
  el.style.filter=(f.dim>0.001)?(LIGHT?`opacity(${1-f.dim*.72}) saturate(${1-f.dim*.8})`:`brightness(${1-f.dim}) saturate(${1-f.dim*.6})`):"none";// 亮色：降暗 = 褪色（压黑会把白卡变成深灰）
  // 裁剪生长：gx 从左往右显露（gxr=1 时从右往左），gy 从下往上显露
  el.style.clipPath=(f.gx<.999||f.gy<.999)?`inset(${(1-f.gy)*100}% ${f.gxr?0:(1-f.gx)*100}% 0 ${f.gxr?(1-f.gx)*100:0}%)`:"none"}
// 每帧开头重置效果（build 中创建的元素无需手动调用；引擎在每帧 update 前自动重置本场景所有元素）
function resetFx(root){root.querySelectorAll("*").forEach(e=>{if(e._fx)setFx(e,{...FX0,...(e._base||{})})})}
// 固定效果：每帧重置后仍保留（如固定旋转 rot、固定降暗）。不要直接写 style.opacity / scale / rotate / translate / filter / clipPath，会被每帧重置覆盖
function base(el,o){el._base={...(el._base||{}),...o};setFx(el,o);return el}
// 生长：沿 x（默认）或 y 方向从 0 显露到完整，用于横条、柱子、切割线
function grow(el,t,s,o={}){const p=eio(P(t,s-LEAD,o.d||.6))*(o.to??1);setFx(el,o.axis==="y"?{gy:p}:{gx:p,gxr:o.rev?1:0});return p}
// 数字滚动：从 a 到 b，d 秒；fmt 可自定义
function count(el,t,s,o={}){const p=eio(P(t,s-LEAD,o.d||1.2)),v=lerp(o.from||0,o.to,p);el.textContent=(o.pre||"")+(o.fmt?o.fmt(v):N(v))+(o.suf||"");return p}
// 打字：cps 每秒字数；caret 是否显示光标
function type(el,t,s,text,o={}){const cps=o.cps||30,n=Math.floor(text.length*P(t,s-LEAD,text.length/cps));
  const blink=o.caret&&(n<text.length||Math.floor(t*2)%2===0);el.innerHTML=esc(text.slice(0,n))+(o.caret&&blink?'<span class="caret"></span>':"");return n/text.length}
// 按时间切换文字（同一位置先后显示不同内容）
function seqText(el,t,list){let i=-1;list.forEach((x,k)=>{if(t>=x[0]-LEAD)i=k});
  if(i<0){el.style.opacity=0;return}if(el._i!==i){el.innerHTML=list[i][1];el._i=i}
  const p=eo(P(t,list[i][0]-LEAD,.4));el.style.opacity=p}
// 扫描高亮：返回当前扫描位置 0–1（用于逐行检查、读取）
const scan=(t,s,d)=>eio(P(t,s-LEAD,d));
// 状态切换：在时刻 s 之后切到 state（配合 setBadge / pill 类名）
const after=(t,s)=>t>=s-LEAD;

/* ===== 项目专属：场景构建（由 scenes.js / scenes/*.js 注入，每个文件各自封装） ===== */
const SCENES={};
__SCENES__

/* ===== 场景与时间轴 ===== */
const scenes=D.scenes;
scenes.forEach(s=>{s.t0=S(s.a);s.t1=SE(s.b);s.enter=s.t0-LEAD-.1;s.steps=(s.sequence||[]).filter(x=>x.at).map(x=>S(x.at,x.dt||0))});
scenes[0].enter=0;
const screens=[];
for(let i=0;i<scenes.length;){const s=scenes[i],c=SCENES[s.id];const span=c&&c.span?c.span:1;
  screens.push({scenes:scenes.slice(i,i+span),custom:c,enter:s.enter,id:s.id});i+=span}
screens.forEach((s,k)=>s.exit=screens[k+1]?screens[k+1].enter:1e9);
// 缺少构建的场景：显示占位（视觉命题暗字），构建脚本会提示
function placeholder(root,sc){const s=sc.scenes[0];
  box(root,"lbl","未制作："+esc(sc.scenes.map(x=>x.id).join("、")),{x:SAFE.x0,y:SAFE.y0}).style.color="var(--err)";
  const e=box(root,"lbl tx",esc(s.prop||""),{x:SAFE.x0,y:CY-40,w:SAFE.x1-SAFE.x0});e.style.whiteSpace="normal";e.style.fontSize="34px";
  return t=>{}}

/* ===== 渲染 ===== */
const stage=document.getElementById("stage"),au=document.getElementById("au");
if(V){stage.classList.add("v");document.body.classList.add("portrait")}
if(LIGHT)stage.classList.add("light");
let T=0,cur=-1,upd=null,root=null;
function screenAt(t){let i=0;for(let k=0;k<screens.length;k++)if(t>=screens[k].enter)i=k;return i}
function sceneAt(t){let i=0;for(let k=0;k<scenes.length;k++)if(t>=scenes[k].enter)i=k;return scenes[i]}
function render(){
  const i=screenAt(T),sc=screens[i];
  if(i!==cur){if(root)root.remove();root=E(stage,"scr");upd=sc.custom?sc.custom.build(root,sc):placeholder(root,sc);cur=i}
  resetFx(root);upd(T);
  // 场景转场：出场前 0.3 秒淡出（如需与下一场景连续，用 span 合并成一个构建）
  // 常驻元素：keep(el,"nav") 标记、且下一个构建声明了同名 keep:["nav"] 时，该元素不随场景淡出（用底色遮罩淡出其余内容）
  const x=eio(P(T,sc.exit-.3,.3)),nk=(screens[i+1]&&screens[i+1].custom&&screens[i+1].custom.keep)||[];
  const kept=nk.length?[...root.children].filter(e=>e.dataset&&nk.includes(e.dataset.keep)):[];
  if(kept.length){root.style.opacity=1;if(!root._veil){root._veil=box(root,"","",{x:0,y:0,w:VW,h:VH});root._veil.style.background="var(--bg)";root._veil.style.zIndex=900}
    root._veil.style.opacity=x;kept.forEach(e=>e.style.zIndex=1000)}
  else{root.style.opacity=1-x;if(root._veil)root._veil.style.opacity=0}
  ui(sceneAt(T));
}

/* ===== 预览界面 ===== */
const fmt=t=>{t=Math.max(0,t);return Math.floor(t/60)+":"+(t%60).toFixed(1).padStart(4,"0")};
const tl=document.getElementById("tl");
scenes.forEach((s,k)=>{const e=document.createElement("span");e.className=(k%2?"alt":"")+(SCENES[s.id]||screens.some(x=>x.scenes.includes(s)&&x.custom)?"":" miss");
  const nx=scenes[k+1]?scenes[k+1].enter:TOTAL;e.style.width=((nx-s.enter)/TOTAL*100)+"%";e.title=`${s.id} ${s.name}`;tl.insertBefore(e,document.getElementById("ph"))});
tl.onclick=e=>{const b=tl.getBoundingClientRect();seek((e.clientX-b.left)/b.width*TOTAL)};
let lastS=null,lastSub=-2;
function ui(s){
  if(s!==lastS){lastS=s;[...tl.querySelectorAll("span")].forEach((x,k)=>x.classList.toggle("cur",scenes[k]===s))}
  document.getElementById("info").innerHTML=`<b>${esc(s.id)}</b> ${esc(s.name)}　${fmt(T)} / ${fmt(TOTAL)}`;
  document.getElementById("ph").style.left=(T/TOTAL*100)+"%";
  let ln=-1;for(const n in D.subs){const q=D.subs[n];if(T>=q[0]&&T<q[1]+.05){ln=+n;break}}
  const key=ln+"|"+s.id;if(key!==lastSub){lastSub=key;
    document.getElementById("sub").innerHTML=(ln>0?`<small>#${ln}　${fmt(D.subs[ln][0])}</small>${esc(D.subs[ln][2])}`:"<small>—</small>")+`<span class="prop">视觉命题：${esc(s.prop||"")}</span>`}
}
let playing=false,clock=null;
function seek(t){T=cl(t,0,TOTAL);if(au.readyState>0)au.currentTime=T;if(playing)clock={w:performance.now(),t:T};render()}
function play(){playing=true;document.getElementById("play").textContent="❚❚ 暂停";if(T>=TOTAL-.05)T=0;clock={w:performance.now(),t:T};
  try{au.currentTime=T;const pr=au.play();if(pr)pr.catch(()=>{})}catch(e){}requestAnimationFrame(tick)}
function pause(){playing=false;au.pause();document.getElementById("play").textContent="▶ 播放"}
function tick(){if(!playing)return;
  T=(!au.paused&&au.readyState>2&&Math.abs(au.currentTime-(clock.t+(performance.now()-clock.w)/1000))<.3)?au.currentTime:clock.t+(performance.now()-clock.w)/1000;
  if(T>=TOTAL){T=TOTAL;render();pause();return}render();requestAnimationFrame(tick)}
const jump=d=>{const s=sceneAt(T+.01),k=scenes.indexOf(s)+d;if(scenes[k])seek(Math.max(0,scenes[k].enter+.01))};
document.getElementById("play").onclick=()=>playing?pause():play();
document.getElementById("prev").onclick=()=>jump(-1);
document.getElementById("next").onclick=()=>jump(1);
document.getElementById("rep").onclick=()=>{seek(sceneAt(T+.01).enter+.01);if(!playing)play()};
document.addEventListener("keydown",e=>{
  if(e.code==="Space"){e.preventDefault();playing?pause():play()}
  else if(e.key==="ArrowRight"){e.preventDefault();jump(1)}
  else if(e.key==="ArrowLeft"){e.preventDefault();jump(-1)}
  else if(e.key==="r"||e.key==="R")document.getElementById("rep").click()});
function fit(){const w=document.getElementById("wrap"),W=w.clientWidth,H=w.clientHeight,s=Math.min(W/VW,H/VH);
  stage.style.transform=`translate(${(W-VW*s)/2}px,${(H-VH*s)/2}px) scale(${s})`}
new ResizeObserver(fit).observe(document.getElementById("wrap"));window.addEventListener("resize",fit);
const q=new URLSearchParams(location.search);if(q.has("bare"))document.body.classList.add("bare");
fit();seek(q.has("t")?+q.get("t"):0);
// 渲染 / 截图接口：?render=1 时由脚本逐帧调用 __frame(t)
if(q.has("render")){document.body.classList.add("bare");fit();window.__frame=t=>{T=t;render();return true};
  window.__scenes=scenes.map((s,k)=>({id:s.id,name:s.name,enter:s.enter,t1:s.t1,exit:scenes[k+1]?scenes[k+1].enter:TOTAL,steps:s.steps}));
  window.__total=TOTAL;window.__size=[VW,VH];
  window.__ready=(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{cur=-1;T=0;render();return true})}
if(document.fonts)document.fonts.ready.then(()=>{cur=-1;render()});
</script>
</body>
