html,body{margin:0}
body{background:var(--ui-bg);color:var(--ui-text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.shell{max-width:1280px;margin:0 auto;padding:14px 16px 28px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.btn{border:1px solid var(--ui-line);background:var(--ui-panel);color:var(--ui-text);border-radius:8px;padding:7px 13px;font:inherit;cursor:pointer}
.btn:hover{border-color:var(--ui-muted)}
.btn.pri{background:var(--ui-acc);border-color:var(--ui-acc);color:#111;font-weight:600}
.sp{flex:1}
.info{font-variant-numeric:tabular-nums;color:var(--ui-muted)}
.info b{color:var(--ui-text);font-weight:600}
.wrap{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:10px;border:1px solid var(--ui-line);background:#000}
body.portrait .wrap{aspect-ratio:9/16;max-width:calc(78vh * 9 / 16);margin:0 auto}
body.portrait.bare .wrap{max-width:none;margin:0}
.tl{position:relative;height:24px;margin-top:10px;display:flex;border-radius:5px;overflow:hidden;cursor:pointer}
.tl span{height:100%;border-right:1px solid var(--ui-bg);background:#23262b}
.tl span.alt{background:#2c3036}
.tl span.miss{background:#5a2a33}
.tl span.cur{background:var(--ui-acc)!important}
.tl i{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none}
.sub{margin-top:8px;padding:9px 14px;background:var(--ui-panel);border:1px solid var(--ui-line);border-radius:8px;min-height:42px;font-size:15px}
.sub small{color:var(--ui-muted);margin-right:8px;font-variant-numeric:tabular-nums}
.sub .prop{display:block;color:var(--ui-muted);font-size:13px;margin-top:4px}
.help{color:var(--ui-muted);font-size:12px;margin-top:8px}
kbd{border:1px solid var(--ui-line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font:12px ui-monospace,Menlo,monospace;background:var(--ui-panel)}
@media (max-width:700px){.shell{padding:12px 16px}}
body.bare .bar,body.bare .tl,body.bare .sub,body.bare .help{display:none}
body.bare .shell{max-width:none;padding:0}body.bare .wrap{border:0;border-radius:0}

/* ===== 舞台：暗色示意风格（规范 v2 第 4 节） ===== */
.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  --bg:#0d0d0d;--win:#1d2025;--winbar:#181a1e;--card:#2c3139;--card2:#23272d;--edge:#454b54;
  --l1:#9aa2ad;--l2:#646c76;--or:#d87756;--tx:#f2f2ee;--mut:#aab1ba;--ok:#a6c985;--err:#dd6b80;--warn:#e3b341;
  --pink:#d87756;--yellow:#e3b341;--blue:#9fb4cf;--teal:#a6c985;--red:#dd6b80;--agent:#d87756;--person-ic:#9fb4cf;--gtrack:#4a5059;
  background:var(--bg);color:var(--tx);font-family:"NSC",sans-serif;font-size:26px;line-height:1.35}
.stage.v{width:1080px;height:1920px}
.scr{position:absolute;inset:0}
.a{position:absolute}
.stage svg{overflow:visible}
/* 容器 */
.card{background:var(--card);border:1px solid var(--edge);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.win{background:var(--win);border:1px solid var(--edge);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.45);overflow:hidden}
.win>.wbar{height:54px;background:var(--winbar);border-bottom:1px solid var(--edge);display:flex;align-items:center;gap:10px;padding:0 20px;font:500 28px/1 "NSC";color:var(--mut)}
.win>.wbar i{width:14px;height:14px;border-radius:50%;background:#3a3d42;flex:none}
.win>.wbar i:nth-child(1){background:#ff5f57}.win>.wbar i:nth-child(2){background:#febc2e}.win>.wbar i:nth-child(3){background:#28c840}
.win>.wbar b{flex:1;text-align:center;font-weight:500;margin-right:72px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win>.wbody{position:absolute;left:0;right:0;top:54px;bottom:0}
.chead{display:flex;align-items:center;gap:14px;font:600 32px/1.2 "NSC";color:var(--tx)}
.chead svg{width:1.05em;height:1.05em;flex:none}
/* 胶囊与标签 */
.pill{display:inline-flex;align-items:center;gap:.36em;white-space:nowrap;background:var(--card);border:1px solid var(--edge);border-radius:999px;padding:.36em .72em;font:500 32px/1 "NSC";color:var(--tx)}
.pill svg{width:1em;height:1em;flex:none}
.pill.or{background:rgba(216,119,86,.16);border-color:rgba(216,119,86,.55);color:#f0a98f}
.pill.ok{background:rgba(166,201,133,.13);border-color:rgba(166,201,133,.5);color:var(--ok)}
.pill.err{background:rgba(221,107,128,.14);border-color:rgba(221,107,128,.55);color:var(--err)}
.pill.warn{background:rgba(227,179,65,.13);border-color:rgba(227,179,65,.5);color:var(--warn)}
.pill.mut{color:var(--mut)}
.lbl{font:500 26px/1.2 "NSC";color:var(--mut);white-space:nowrap}
.lbl.tx{color:var(--tx)}
.big{font:600 64px/1 "NSC";font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mono{font-family:"JBM",monospace}
/* 骨架横条 */
.sk{height:12px;border-radius:6px;background:var(--l2)}
.sk.l1{background:var(--l1)}.sk.or{background:var(--or)}.sk.ok{background:var(--ok)}.sk.err{background:var(--err)}.sk.warn{background:var(--warn)}
/* 风格化终端 */
.term .wbody{padding:22px 28px;font:400 26px/1.7 "JBM",monospace;color:var(--tx)}
.term .ln{white-space:pre;overflow:hidden}
.term .ln .p{color:var(--mut)}.term .ln .o{color:var(--or)}.term .ln .g{color:var(--ok)}.term .ln .r{color:var(--err)}.term .ln .m{color:var(--mut)}
.caret{display:inline-block;width:.55em;height:1.05em;background:var(--tx);vertical-align:-.18em}
/* 图标与状态徽标 */
.ico{display:grid;place-items:center}
.ico svg{width:100%;height:100%}
.badge{border-radius:50%;display:grid;place-items:center;border:2px solid var(--l2);background:var(--card)}
.badge svg{width:100%;height:100%}
.badge.ok{background:var(--ok);border-color:var(--ok)}.badge.err{background:var(--err);border-color:var(--err)}
.badge.warn{background:transparent;border:0}.badge.or{background:var(--or);border-color:var(--or)}
.badge.idle{background:transparent}
/* 代理与人 */
.agent{border-radius:16px;background:var(--card);border:1px solid var(--edge);display:grid;place-items:center}
.agent svg{width:58%;height:58%}
.agent.bare{background:transparent;border:0}
.person{border-radius:50%;background:#2c3a4d;border:2px solid #45576f;display:grid;place-items:center}
.person>span{width:56%;height:56%}
.person svg{width:100%;height:100%}
/* 容量条、进度条 */
.meter{background:#15171a;border:1px solid var(--edge);border-radius:999px;overflow:hidden}
.meter>i{display:block;height:100%;width:0;background:var(--l1);border-radius:999px}
/* 焦点：被降暗 / 模糊的元素 */
.hl{outline:2px solid var(--or);outline-offset:4px}
/* 流程节点 */
.node{border-radius:16px;background:var(--card);border:1px solid var(--edge);display:grid;place-items:center;color:var(--mut)}
.node svg{width:46%;height:46%}
/* 章节进度条 */
.chap{height:8px;border-radius:4px;background:var(--l2);overflow:hidden}
.chap>i{display:block;height:100%;width:0;background:var(--or)}

/* ===== 亮色主题（Gumroad 官网风格）：build_film.py --theme light 时 .stage 加 .light =====
   米白底、纯黑粗描边、硬投影、粉色 = 当前（色块用 --pink，线条 / 文字用深一档的 --or），平涂色块，不用渐变、发光、模糊阴影 */
.stage.light{--bg:#f4f4f0;--win:#ffffff;--winbar:#ffffff;--card:#ffffff;--card2:#e4e4dc;--edge:#000000;
  --l1:#242423;--l2:#b8b8b0;--or:#e84fc8;--tx:#000000;--mut:#3d3d3a;--ok:#23a094;--err:#dc341e;--warn:#ffc900;
  --pink:#ff90e8;--yellow:#ffc900;--blue:#90a8ed;--teal:#23a094;--red:#dc341e;--agent:#000000;--person-ic:#000000;--gtrack:#d6d6ce}
.stage.light::before{content:"";position:absolute;right:-170px;bottom:-190px;width:480px;height:480px;border-radius:50%;background:var(--yellow);border:4px solid #000}
.stage.light::after{content:"";position:absolute;right:250px;bottom:40px;width:74px;height:74px;border-radius:50%;background:var(--pink);border:4px solid #000}
.stage.light.v::before{right:-150px;top:-170px;bottom:auto}.stage.light.v::after{right:230px;top:60px;bottom:auto}
.stage.light .scr{z-index:1}
.stage.light .card{border:3px solid #000;border-radius:14px;box-shadow:6px 6px 0 #000}
.stage.light .win{border:3px solid #000;border-radius:14px;box-shadow:8px 8px 0 #000}
.stage.light .win>.wbar{border-bottom:3px solid #000;color:#000;font-weight:700}
.stage.light .win>.wbar i{border:2px solid #000}
.stage.light .win>.wbar i:nth-child(1){background:var(--pink)}.stage.light .win>.wbar i:nth-child(2){background:var(--yellow)}.stage.light .win>.wbar i:nth-child(3){background:var(--blue)}
.stage.light .chead{font-weight:800;color:#000}
.stage.light .pill{background:#fff;border:3px solid #000;color:#000;font-weight:700}
.stage.light .pill.or{background:var(--pink);border-color:#000;color:#000}
.stage.light .pill.ok{background:var(--teal);border-color:#000;color:#fff}
.stage.light .pill.err{background:var(--red);border-color:#000;color:#fff}
.stage.light .pill.warn{background:var(--yellow);border-color:#000;color:#000}
.stage.light .pill.mut{background:#fff;color:#3d3d3a}
.stage.light .lbl{color:#3d3d3a;font-weight:600}.stage.light .lbl.tx{color:#000;font-weight:700}
.stage.light .big{font-weight:800}
.stage.light .caret{background:#000}
.stage.light .badge{border:3px solid #000;background:#fff}
.stage.light .badge.ok{background:var(--teal);border-color:#000}.stage.light .badge.err{background:var(--red);border-color:#000}.stage.light .badge.or{background:var(--pink);border-color:#000}
.stage.light .badge.warn{border:0;background:transparent}.stage.light .badge.idle{background:#fff}
.stage.light .agent{border:3px solid #000;box-shadow:4px 4px 0 #000}.stage.light .agent.bare{border:0;box-shadow:none}
.stage.light .person{background:var(--blue);border:3px solid #000}
.stage.light .meter{background:#fff;border:3px solid #000}
.stage.light .node{border:3px solid #000;box-shadow:5px 5px 0 #000;color:#000}
.stage.light .chap>i{background:var(--pink)}
.stage.light .hl{outline:3px solid #000}
</style>
</head>
<body>
<div class="shell">
  <div class="bar">
    <button class="btn pri" id="play">▶ 播放</button>
    <button class="btn" id="prev">← 上一场景</button>
    <button class="btn" id="next">下一场景 →</button>
    <button class="btn" id="rep">↺ 本场景</button>
    <span class="info" id="info"></span>
    <span class="sp"></span>
  </div>
  <div class="wrap" id="wrap"><div class="stage" id="stage"></div></div>
  <div class="tl" id="tl"><i id="ph"></i></div>
  <div class="sub" id="sub"></div>

</div>

没有 logo 时写短字。"], "44": [160.2, 164.4, "状态依次切换：待命、当前、通过、失败，最后降暗。"], "45": [164.9, 168.7, "每个判断都带一个分数，表示有多大把握。"], "46": [169.05, 173.85, "把判断卡挂到 0 到 1 的轴上，越靠右越确定。"], "47": [174.2, 178.6, "0.55 这张挂在中间，说明它自己也拿不准。"], "48": [179.1, 181.9, "一次给所有候选打分。"], "49": [182.25, 185.05, "按分数从高到低重新排队。"], "50": [185.4, 188.2, "只打开排在最前面的三个。"], "51": [188.55, 191.75, "旁白没给具体概率时，用圆环加「概率」两个字表示。"], "52": [192.05, 195.05, "不写数字，也不用灰块占位。"], "53": [195.85, 198.45, "D 组：流程与进度。走到第几步、排队到达、一个个过、谁先到。"], "54": [198.8, 203.0, "横向节点链：节点逐个出现，连线逐段生长。"], "55": [203.35, 207.55, "当前步骤用橙色往前推进，走到第四步出错变红。"], "56": [208.35, 211.15, "五个步骤排成一条步骤条，现在停在第一步。"], "57": [211.45, 214.15, "每走完一步就打上灰勾，连线填充到下一步。"], "58": [214.45, 217.15, "当前步骤始终是橙色，一眼看出走到了第几步。"], "59": [217.5, 221.7, "章节导航清单先在中央出现，没讲到的项模糊占位。"], "60": [222.05, 226.25, "讲完的项降暗，编号变灰带勾，然后整张清单缩到左上角常驻。"], "61": [226.6, 230.8, "路线图是一条轨道挂着几张卡，当前一站是橙色。"], "62": [231.15, 235.35, "往前走一站，上一站变成灰色小勾并降暗，下一站由模糊变清楚。"], "63": [236.15, 238.95, "请求一条条到达队列，新的一条从顶部弹入。"], "64": [239.25, 241.95, "新项进入时，旧的几项平滑往下移。"], "65": [242.25, 244.95, "超过五条上限，最旧的一条从底部淡出。"], "66": [245.75, 248.55, "一摞测试案例叠在一起，最上面一张先被检查。"], "67": [248.85, 251.55, "检查完就滑到最底，下一张顶上来。"], "68": [251.85, 254.55, "很多案例就这样一个接一个过完。"], "69": [254.9, 259.1, "两条泳道并排，时间块逐段生长，比较谁更快。"], "70": [259.45, 263.65, "慢的那条越过时限线，越线的部分和时限线一起变红。"], "71": [264.15, 268.55, "看一眼页面、判断下一步、动手点击，这是一轮。"], "72": [268.9, 272.9, "没到目标，就沿着回环再来一轮，计数加一。"], "73": [273.25, 277.05, "第三轮判断目标已达成，从上方出口离开。"], "74": [277.85, 280.45, "E 组：数量与计时。数字涨跌、大数对比、倒计时。"], "75": [280.8, 285.0, "大数字卡：数字从零滚动到旁白给出的值。"], "76": [285.35, 289.55, "两张卡并排比较，结果差的那一张变成红色。"], "77": [290.35, 293.15, "数字像里程表一样，每一位竖向滚到目标值。"], "78": [293.45, 296.15, "本月 Token 用量从十二万八千四百涨到三十五万六千九百二十。"], "79": [296.45, 299.15, "平均耗时从八百四十二毫秒降到五百一十七毫秒，数字向下滚。"], "80": [299.95, 302.75, "棋钟上，白方和黑方各有五分钟。"], "81": [303.05, 305.75, "轮到白方，时间一格一格翻牌往下走。"], "82": [306.05, 308.75, "走到零点零零，白方超时判负。"], "83": [309.25, 312.05, "把一次调用的费用逐项列出来。"], "84": [312.4, 316.6, "问题送过去按量计费，答案传回来这一项免费。"], "85": [316.95, 319.75, "合计就只剩发送问题这一项。"], "86": [320.25, 324.45, "两边同时开始，各自一个计时器、一个计费器。"], "87": [324.8, 328.4, "右边 8 秒就停了，只花 3 分钱。"], "88": [328.75, 332.55, "左边跑到 34 秒，花了 4 毛 3。"], "89": [333.35, 335.95, "F 组：状态与检查。正在处理、扫描筛查、两边对照。"], "90": [336.75, 339.55, "左边是静态的橙色描边，只表示当前这一项。"], "91": [339.85, 342.55, "右边的光点沿着边框匀速跑动，表示正在处理中。"], "92": [342.85, 345.55, "处理完成，光点停下，边框变成绿色。"], "93": [346.35, 349.15, "十五个依赖包排成网格，状态都还未知。"], "94": [349.45, 352.15, "扫描线从左到右扫过，扫过的包立刻亮出结果。"], "95": [352.45, 355.15, "通过是绿，可疑是黄，查不出的保持灰色。"], "96": [355.5, 359.7, "两栏同构对照：左右结构完全一样，只有内容不同。"], "97": [360.05, 364.25, "先看左栏再看右栏，焦点之外的那一栏降暗。"], "98": [364.75, 367.95, "五个问题排成一列，交给判定模型。"], "99": [368.3, 371.9, "每一行依次打上是或否，附上把握分数。"], "100": [372.4, 376.0, "三种角色，逐个登录，挨个页面试一遍。"], "101": [376.35, 379.75, "管理员全部能进；经理有两页被挡住。"], "102": [380.1, 382.9, "员工只能进两页。"], "103": [383.7, 386.3, "G 组：否定与替换。排除、揭穿真面目、被新版本替换。"], "104": [386.65, 390.85, "否定不用删除线：元素降暗，旁边弹出一枚红叉徽标。"], "105": [391.2, 395.4, "也可以把禁止标记放在旁边，或者让被丢弃的元素连同徽标一起掉落。"], "106": [395.75, 399.95, "节点翻面，揭示它的真实类型。"], "107": [400.3, 404.5, "禁止标记放在元素旁边，不压在元素上。"], "108": [405.3, 408.1, "左边是一张手写的草稿卡片。"], "109": [408.4, 411.1, "像素格按确定的乱序逐块覆盖，替换成生成的版本。"], "110": [411.4, 414.1, "换成半调网点的顺序，再替换成定稿。"], "111": [414.6, 418.2, "对话里的每条消息先判一下：留还是丢。"], "112": [418.55, 422.55, "判为丢的淡出，下面的往上补位，整段变短。"], "113": [423.35, 425.95, "H 组：标注与背景。括号归组、空槽与编号、舞台质感。"], "114": [426.3, 430.5, "括号把一组东西括在一起，标签写在括号背面。"], "115": [430.85, 435.05, "梳形括号多出几根齿，一次指向链上的几个节点；大括号用来竖向归组。"], "116": [435.4, 439.6, "虚线框表示空槽，旁边的小编号块给问题编号。"], "117": [439.95, 444.15, "内容填进来时，卡片落进空槽，把位置占满。"], "118": [444.95, 447.75, "同一个画面，左边没有背景，右边铺一层极淡的点阵。"], "119": [448.05, 450.75, "点阵只增加舞台质感，不抢主体。"], "120": [451.05, 453.75, "主体照常变化，当前节点附近的点稍微亮起。"], "121": [454.25, 458.25, "左边是规则，右边是测试，有测试的连起来。"], "122": [458.6, 462.2, "没有测试的规则标红，旁边写明无对应。"], "123": [462.55, 465.55, "其余的暗下去，只留下两个缺口。"]}, "scenes": [{"id": "a0", "name": "A · 出现与揭示（分组标题）", "a": 1, "b": 1, "prop": "分组标题：出现与揭示——东西怎么登场：从看不清到看清、从乱码到答案、一条条写出来", "comps": "blurText · splitRise · scramble · writer ·     Object.assign(e.style,{backgroundImage:`radial-gradient(circle, rgba(${LIGHT?"0,0,0":"238,238,234"},${LIGHT?a*.7:a}) ${r}px, rgba(${LIGHT?"0,0,0":"238,238,234"},0) ${r+.8}px)`,backgroundSize:`${gap}px ${gap}px`,backgroundPosition:`${gap/2}px ${gap/2}px`,pointerEvents:"none"});
    p.insertBefore(e,p.firstChild);return e};
  const e=mk(op);e.style.maskImage=e.style.webkitMaskImage="radial-gradient(closest-side, #000 70%, transparent 100%)";
  if(o.glow){e.hi=mk(Math.min(.7,op*5));e.hi.style.maskImage=e.hi.style.webkitMaskImage="radial-gradient(circle 0px at 0 0, #000, transparent)";p.insertBefore(e,e.hi.nextSibling)}return e};
// 点阵高亮：把较亮的点阵层露在 (x,y)（相对点阵左上角）附近 r 像素，amt 0–1 强度
function dotGlow(G,x,y,r=220,amt=1){if(!G.hi)return;const m=amt>0?`radial-gradient(circle ${r}px at ${x.toFixed(1)}px ${y.toFixed(1)}px, rgba(0,0,0,${amt.toFixed(3)}), transparent)`:"radial-gradient(circle 0px at 0 0, #000, transparent)";
  G.hi.style.maskImage=G.hi.style.webkitMaskImage=m};

/* ========== 2026-09 新增：逐帧分析参考片后提炼的画法（只借表达机制，代码按本引擎重写） ==========
   tokenRow 词块切分与聚焦 · searchHits 检索命中 · pinAxis 置信度轴挂卡 · rankList 按分数重排
   loopCycle 迭代循环 · ledger 费用明细 · runClock 计时 / 计费 · verdictList 逐条判定与收拢
   matrix 角色 × 项目检查矩阵 · matchLinks 两列对应与缺口 */

// 数字格式：runClock / ledger 常用
const FMT={s:v=>v.toFixed(1)+"s",s2:v=>v.toFixed(2)+"s",mmss:v=>{v=Math.max(0,Math.floor(v));return Math.floor(v/60)+":"+String(v%60).padStart(2,"0")},
  usd:v=>"$"+v.toFixed(2),usd3:v=>"$"+v.toFixed(3),int:v=>N(Math.round(v)),p2:v=>v.toFixed(2)};

// 词块切分：toks 词块数组（一个词可以拆成两块，如 ["Pay","roll"]），逐块“打出”，再只保留关键块
// x,y 左上角；size 字号（40）；gap 块间距（10）；pal 色块循环（pink/yellow/blue/teal/or）；mono:0 改用正文字体
// 返回行元素 R，.toks；R.type(t,s,{per=.12}) 逐块出现 + 橙色光标；R.focus(t,s,idx,{to=.3,sc=1.08}) idx 以外降暗、idx 略放大
function tokenRow(p,toks,o={}){const s=o.size||40,g=o.gap??10,pal=o.pal||["pink","yellow","blue","teal","or"],ff=o.mono===0?"NSC":"JBM,monospace";
  const R=box(p,"","",{x:o.x,y:o.y});Object.assign(R.style,{display:"flex",gap:g+"px",alignItems:"center",whiteSpace:"nowrap"});
  R.toks=toks.map((w,i)=>{const c=pal[i%pal.length],cv=TONE[c]||`var(--${c})`,e=E(R,"tok",esc(w));
    Object.assign(e.style,{font:`500 ${s}px/1.15 ${ff}`,padding:`${Math.round(s*.2)}px ${Math.round(s*.26)}px`,borderRadius:Math.round(s*.2)+"px",color:"var(--tx)",
      background:`color-mix(in srgb, ${cv} 28%, var(--card))`,border:`${LIGHT?3:1}px solid color-mix(in srgb, ${cv} ${LIGHT?0:55}%, ${LIGHT?"#000":"var(--edge)"})`});return e});
  R.caret=box(R,"","",{x:0,y:0,w:Math.max(4,Math.round(s*.1)),h:Math.round(s*1.3)});R.caret.style.background="var(--or)";R.caret.style.borderRadius="2px";
  R.type=(t,s0,op={})=>{const per=op.per||.12;let last=-1;R.toks.forEach((e,i)=>{if(A(e,t,s0+i*per,{k:"fade",d:Math.max(.15,per*1.4)})>0)last=i});
    const L=R.toks[Math.max(0,last)];R.caret.style.left=(last<0?0:L.offsetLeft+L.offsetWidth+Math.max(4,g/2))+"px";R.caret.style.top=((R.offsetHeight-R.caret.offsetHeight)/2)+"px";
    const end=s0+R.toks.length*per+.8;setFx(R.caret,{op2:t<s0-LEAD||t>end?0:blink(t)});return last};
  R.focus=(t,s0,idx,op={})=>{R.toks.forEach((e,i)=>{if(idx.includes(i))zoom(e,t,s0,{to:op.sc??1.08});else dim(e,t,s0,{to:op.to??.3})})};
  return R}

// 检索命中：顶部搜索框（打字 + 关键词变橙）+ 下方文件块网格；命中的块变橙、其余降暗
// x,y,w（1600）；items 块文字；cols 列数（5）；ch 块高（74）；gap（16）；size 字号（28）；query 查询句；keys 查询里要标橙的词；icon 块图标（doc）
// 返回 {box,q,cells}；H.type(t,s,{cps=18}) 打字；H.hit(t,s,hits,{stag=.06,to=.3}) 关键词标橙 + 命中块逐个变橙 + 其余降暗
function searchHits(p,o={}){const w=o.w||1600,x=o.x??CX-w/2,y=o.y??200,cols=o.cols||5,gp=o.gap??16,ch=o.ch||74,fs=o.size||28,cw=(w-(cols-1)*gp)/cols,qw=o.qw||Math.min(w,1000);
  const H={};H.box=box(p,"card","",{x:x+(w-qw)/2,y,w:qw,h:84});H.box.innerHTML=`<span style="position:absolute;left:26px;top:22px;width:40px;height:40px;display:grid;color:var(--mut)">${ico("search")}</span>`;
  H.q=box(H.box,"","",{x:84,y:22});Object.assign(H.q.style,{font:`500 34px/40px NSC`,color:"var(--tx)",whiteSpace:"nowrap"});
  H.cells=(o.items||[]).map((s,i)=>{const c=box(p,"card","",{x:x+(i%cols)*(cw+gp),y:y+124+Math.floor(i/cols)*(ch+gp),w:cw,h:ch});c.style.boxShadow="none";
    c.innerHTML=`<span style="position:absolute;left:18px;top:${(ch-30)/2}px;width:30px;height:30px;display:grid;color:var(--mut)">${ico(o.icon||"doc")}</span>`;
    c.t=lbl(c,s,{x:60,y:(ch-fs*1.2)/2,size:fs,tx:1});c.t.classList.add("mono");return c});
  const Q=o.query||"",keys=o.keys||[];
  const render=(n,hl)=>{let s=esc(Q.slice(0,n));if(hl)keys.forEach(k=>{s=s.split(esc(k)).join(`<b style="font-weight:500;color:var(--or)">${esc(k)}</b>`)});return s};
  H.type=(t,s,op={})=>{const cps=op.cps||18,n=Math.floor(Q.length*P(t,s-LEAD,Q.length/cps));H._n=n;return n};
  H.hit=(t,s,hits,op={})=>{const on=after(t,s),v=render(H._n??Q.length,on)+(t>=(H._s??-1e9)&&(H._n??Q.length)<Q.length&&Math.floor(t*2)%2?'<span class="caret"></span>':"");
    if(H.q._v!==v){H.q._v=v;H.q.innerHTML=v}
    H.cells.forEach((c,i)=>{const k=hits.indexOf(i);if(k>=0){const q=P(t,s+.2+k*(op.stag??.06)-LEAD,.35);tint(c,q>0?"or":null,.2*q);c.t.style.color=q>.5?"var(--or)":""}
      else dim(c,t,s+.2,{to:op.to??.3})})};
  return H}

// 置信度轴：0–1 横轴，判定卡挂在各自分数的位置（竖杆连到轴上的圆点）；分数越靠右越有把握
// x,y（轴所在高度，默认 820），w（1400）；ticks 刻度（[0,.5,1]），labels 刻度文字；ls 刻度字号（30）
// 返回 G；G.pin({v,text,tag,tone,h,cw,chh}) 建一张挂卡（h = 卡底离轴高度，错开避免重叠）→ 句柄 .play(t,s)；G.show(t,s) 轴出现
function pinAxis(p,o={}){const w=o.w||1400,x=o.x??CX-w/2,y=o.y??820,ls=o.ls||30,G={x,y,w,ax:v=>x+v*w};
  G.line=box(p,"","",{x,y:y-2,w,h:4});G.line.style.background="var(--l1)";G.line.style.borderRadius="2px";
  const tk=o.ticks||[0,.5,1],tl=o.labels||tk.map(v=>String(v));
  G.ticks=tk.map((v,k)=>{const e=box(p,"","",{x:x+v*w-2,y:y-12,w:4,h:24});e.style.background="var(--l1)";const l=lbl(p,tl[k],{x:x+v*w,y:y+26,center:1,size:ls});l.classList.add("mono");e.l=l;return e});
  G.show=(t,s)=>{grow(G.line,t,s,{d:.6});G.ticks.forEach((e,k)=>{A(e,t,s+.1*k,{k:"fade"});A(e.l,t,s+.1*k,{k:"fade"})})};
  G.pin=q=>{const cw=q.cw||440,chh=q.chh||150,sx=G.ax(q.v),cx=cl(sx-cw/2,x-60,x+w-cw+60),cy=y-(q.h||240)-chh;
    const c=card(p,{x:cx,y:cy,w:cw,h:chh});lbl(c,q.text,{x:24,y:22,size:28,tx:1});
    if(q.tag)pill(c,q.tag,{x:24,y:chh-70,size:28,tone:q.tone});
    const num=box(c,"mono",q.v.toFixed(2),{x:cw-184,y:chh-78,w:160});Object.assign(num.style,{font:"600 50px/1 JBM,monospace",color:"var(--tx)",textAlign:"right"});
    const stem=box(p,"","",{x:sx-1.5,y:cy+chh,w:3,h:y-cy-chh});stem.style.background="var(--l1)";
    const dt=box(p,"","",{x:sx-11,y:y-11,w:22,h:22});Object.assign(dt.style,{borderRadius:"50%",background:"var(--tx)"});
    return{card:c,stem,dot:dt,num,play(t,s){A(c,t,s,{k:"drop"});A(dt,t,s+.25,{k:"pop"});grow(stem,t,s+.25,{axis:"y",d:.4})}}};
  return G}

// 按分数重排：items=[[文字,分数0–1],...] 按给定顺序排好；逐行出现（分数条和数字一起长），再按分数从高到低换位，前 k 名高亮
// x,y,w（900），rh 行高（84），size 字号（32），bw 分数条宽（220）
// 返回 R（.rows，.order 排序后的原索引）；R.show(t,s,{per=.12}) / R.sort(t,s,{d=.9,stag=.03}) / R.top(t,s,k,{to=.3})
function rankList(p,o={}){const it=o.items||[],w=o.w||900,x=o.x??CX-w/2,y=o.y??200,rh=o.rh||84,fs=o.size||32,bw=o.bw||220;
  const R={};R.order=it.map((_,i)=>i).sort((a,b)=>it[b][1]-it[a][1]);const rank=[];R.order.forEach((k,r)=>rank[k]=r);
  R.rows=it.map(([s,v],i)=>{const r=box(p,"card","",{x,y:y+i*rh,w,h:rh-12});r.style.boxShadow="none";
    r.t=lbl(r,s,{x:24,y:(rh-12-fs*1.2)/2,size:fs,tx:1});r.t.classList.add("mono");
    r.m=meter(r,{x:w-bw-150,y:(rh-12-12)/2,w:bw,h:12});r.n=box(r,"mono","",{x:w-128,y:(rh-12-fs*1.2)/2,w:104});Object.assign(r.n.style,{fontSize:fs+"px",textAlign:"right",color:"var(--tx)"});r.v=v;return r});
  R.show=(t,s,op={})=>R.rows.forEach((r,i)=>{const s1=s+i*(op.per??.12);A(r,t,s1,{k:"fade"});const q=eio(P(t,s1-LEAD,.6));setMeter(r.m,r.v*q,"l1");r.n.textContent=q>0?(r.v*q).toFixed(2):""});
  R.sort=(t,s,op={})=>R.rows.forEach((r,i)=>mv(r,t,s+i*(op.stag??.03),{to:[0,(rank[i]-i)*rh],d:op.d||.9}));
  R.top=(t,s,k,op={})=>R.rows.forEach((r,i)=>{if(rank[i]<k){const q=after(t,s);tint(r,q?"or":null,.16);setMeter(r.m,r.v,q?"or":"l1")}else dim(r,t,s,{to:op.to??.3})});
  return R}

// 迭代循环：三步一轮（如 看 → 判断 → 动手），走完一轮沿下方回环进入下一轮，计数胶囊记第几轮；中间一步上方两个出口（达成 / 受阻）
// x,y（三张卡顶边），w 总宽（1400），names 三步名，spread 两个出口离中线的距离（170），cw,chh 卡尺寸（380×150），goal 顶部目标文字，exits=[[文字,tone],...]，counter(k) 计数文字
// 返回 L（.cards .exits）；L.show(t,s)；L.run(t,rounds) rounds=[{s,texts:[三步内容],per=.8,n=3}]（n 这一轮走到第几步就停，最后一轮在判断处出去时写 2）当前步橙框、回环橙线；L.exit(t,s,i) 走第 i 个出口
function loopCycle(p,svg,o={}){const nm=o.names||["看","判断","动手"],w=o.w||1400,cw=o.cw||380,chh=o.chh||150,x0=o.x??CX-w/2,y=o.y??460,gp=(w-3*cw)/2,cy=y+chh/2;
  const L={};L.cards=nm.map((s,i)=>{const c=card(p,{x:x0+i*(cw+gp),y,w:cw,h:chh});c.k=lbl(c,s,{x:26,y:20,size:28});c.v=lbl(c,"",{x:26,y:70,size:36,tx:1});return c});
  L.links=[0,1].map(i=>link(svg,{pts:[[x0+(i+1)*cw+i*gp+12,cy],[x0+(i+1)*(cw+gp)-14,cy]],tone:"l1",w:3,arrow:1}));
  const xa=x0+2*(cw+gp)+cw/2,xb=x0+cw/2,yb=y+chh+14,dip=o.dip||120,arcD=`M${xa} ${yb} C${xa} ${yb+dip} ${xb} ${yb+dip} ${xb} ${yb+4}`;
  L.arc=link(svg,{d:arcD,tone:"l2",w:3,arrow:1});L.hot=link(svg,{d:arcD,tone:"or",w:4});
  L.cnt=pill(p,"",{x:CX,y:yb+dip*.75-4,size:28});centered(L.cnt);L.cnt.style.left=(x0+w/2)+"px";
  const mx=x0+cw+gp+cw/2,ex=o.exits||[["达成","ok"],["受阻","err"]],sp=o.spread||170;
  L.exits=ex.map(([s,tone],i)=>{const e=pill(p,s,{x:mx+(i?sp:-sp),y:y-150,size:30,icon:tone==="ok"?"check":"cross"});centered(e);e.tone=tone;
    e.ln=link(svg,{pts:[[mx,y-10],[mx,y-70],[mx+(i?sp:-sp),y-70],[mx+(i?sp:-sp),y-122]],tone:"l2",w:3});return e});
  if(o.goal){L.goal=lbl(p,o.goal,{x:mx,y:y-250,center:1,size:32,tx:1})}
  const cf=o.counter||(k=>"第 "+k+" 轮");
  L.show=(t,s)=>{L.cards.forEach((c,i)=>A(c,t,s+i*.15,{k:"pop"}));L.links.forEach((l,i)=>draw(l,t,s+.3+i*.15,.4));draw(L.arc,t,s+.6,.6);
    A(L.cnt,t,s+.8,{k:"pop"});L.exits.forEach((e,i)=>{draw(e.ln,t,s+.9,.4);A(e,t,s+1.1+i*.1,{k:"pop"})});if(L.goal)A(L.goal,t,s+.2,{k:"fade"})};
  L.run=(t,R)=>{let k=-1;R.forEach((r,i)=>{if(t>=r.s-LEAD)k=i});const per=k>=0?(R[k].per||.8):.8;
    const ns=k>=0?(R[k].n||3):3,j=k<0?-1:Math.min(ns-1,Math.floor((t-R[k].s+LEAD)/per));
    L.cards.forEach((c,i)=>{const txt=k<0?"":i<=j?R[k].texts[i]:(k>0?R[k-1].texts[i]:"");_fxT(c.v,txt);c.style.borderColor=i===j?"var(--or)":"";tint(c,i===j?"or":null,i===j?.1:0)});
    _fxT(L.cnt.lastChild,cf(Math.max(1,k+1)));
    const e=k>=0?R[k].s+ns*per:1e9,nx=k>=0&&k<R.length-1?R[k+1].s:null;
    L.hot.style.strokeDashoffset=nx!=null&&t>=e-LEAD&&t<nx-LEAD?L.hot.len*(1-eio(P(t,e-LEAD,Math.max(.2,nx-e)))):L.hot.len;return k};
  L.exit=(t,s,i)=>{const on=after(t,s);L.exits.forEach((e,k)=>{if(k===i){e.className="a pill"+(on?" "+e.tone:"");e.ln.setAttribute("stroke",on?TONE[e.tone]:TONE.l2);if(on)pulse(e,t,s)}else dim(e,t,s,{to:.4})});
    const m=L.cards[1];if(on){m.style.borderColor=TONE[L.exits[i].tone];tint(m,L.exits[i].tone,.14)}};
  return L}

// 费用明细：每行 名称（+小字说明）+ 右侧金额；可给某行盖胶囊（如「免费」）并着色；底部合计滚动
// x,y,w（900），title 标题，items=[[名称,金额文字,说明?],...]（金额只写旁白给的数），rh 行高（100），total=[标签,初始文字]
// 返回 L（.rows .tot）；L.show(t,s,{per=.5}) / L.mark(t,s,i,tag,tone="ok") / L.sum(t,s,{from,to,fmt})
function ledger(p,o={}){const it=o.items||[],w=o.w||900,rh=o.rh||100,top=o.title?96:24,H=top+it.length*rh+(o.total?rh+10:0)+14,x=o.x??CX-w/2,y=o.y??CY-H/2;
  const c=card(p,{x,y,w,h:H,title:o.title});if(c.head)title(c,34);
  c.rows=it.map(([a,v,sub],i)=>{const r=box(c,"","",{x:16,y:top+i*rh,w:w-32,h:rh-10});r.style.borderRadius="12px";
    r.a=lbl(r,a,{x:20,y:sub?10:(rh-10-38)/2,size:32,tx:1});if(sub)r.sub=lbl(r,sub,{x:20,y:52,size:26});
    r.v=box(r,"mono",esc(v),{x:w-32-260,y:(rh-10-44)/2,w:240});Object.assign(r.v.style,{font:"600 40px/44px JBM,monospace",textAlign:"right",color:"var(--tx)"});return r});
  if(o.total){const ty=top+it.length*rh+6;c.sep=box(c,"","",{x:24,y:ty,w:w-48,h:2});c.sep.style.background="var(--l2)";
    c.tl=lbl(c,o.total[0],{x:36,y:ty+(rh-38)/2,size:32});c.tot=box(c,"mono",esc(o.total[1]||""),{x:w-300,y:ty+(rh-60)/2+4,w:264});Object.assign(c.tot.style,{font:"700 56px/60px JBM,monospace",textAlign:"right",color:"var(--tx)"})}
  c.show=(t,s,op={})=>{A(c,t,s,{k:"pop"});c.rows.forEach((r,i)=>A(r,t,s+.3+i*(op.per??.5),{k:"left"}));if(c.tot){const st=s+.3+c.rows.length*(op.per??.5);A(c.sep,t,st,{k:"fade"});A(c.tl,t,st,{k:"fade"});A(c.tot,t,st,{k:"fade"})}};
  c.mark=(t,s,i,tag,tone="ok")=>{const r=c.rows[i];if(!r.tag){r.tag=pill(r,tag,{x:0,y:(rh-10-50)/2,size:28,tone});r.tag.style.right="290px";r.tag.style.left="auto"}
    A(r.tag,t,s,{k:"pop"});const on=after(t,s);tint(r,on?tone:null,on?.14:0);r.v.style.color=on?TONE[tone]:""};
  c.sum=(t,s,op={})=>count(c.tot,t,s,{from:op.from||0,to:op.to,d:op.d||1.2,fmt:op.fmt||FMT.usd});
  return c}

// 计时 / 计费读数：图标 + 等宽数字；在 s 到 e 之间匀速走（时钟不缓动），结束后停住并变色（默认绿 = 先完成）
// x,y；size 字号（44）；icon（clock，计费用 coin）；返回元素；C.run(t,s,e,{from=0,to,fmt=FMT.s,tone="ok"}) 返回是否已停
function runClock(p,o={}){const s=o.size||44,C=box(p,"","",{x:o.x,y:o.y});Object.assign(C.style,{display:"flex",alignItems:"center",gap:Math.round(s*.3)+"px",whiteSpace:"nowrap"});
  C.innerHTML=`<span style="display:grid;width:${Math.round(s*.8)}px;height:${Math.round(s*.8)}px;color:var(--mut)">${ico(o.icon||"clock")}</span><span class="mono" style="font:600 ${s}px/1 JBM,monospace;color:var(--tx)"></span>`;
  C.num=C.lastChild;C.ic=C.firstChild;
  C.run=(t,s0,e,op={})=>{const q=cl((t-(s0-LEAD))/Math.max(.01,e-s0)),stop=q>=1;_fxT(C.num,(op.fmt||FMT.s)(lerp(op.from||0,op.to,q)));
    const col=stop?TONE[op.tone||"ok"]:"";C.num.style.color=col;C.ic.style.color=col||"var(--mut)";return stop};
  return C}

const scenes=D.scenes;

  screens.push({scenes:scenes.slice(i,i+span),custom:c,enter:s.enter,id:s.id});i+=span}

function sceneAt(t){let i=0;for(let k=0;k<scenes.length;k++)if(t>=scenes[k].enter)i=k;return scenes[i]}
function render(){
  const i=screenAt(T),sc=screens[i];
  if(i!==cur){if(root)root.remove();root=E(stage,"scr");upd=sc.custom?sc.custom.build(root,sc):placeholder(root,sc);cur=i}

  if(kept.length){root.style.opacity=1;if(!root._veil){root._veil=box(root,"","",{x:0,y:0,w:VW,h:VH});root._veil.style.background="var(--bg)";root._veil.style.zIndex=900}

/* ===== 预览界面 ===== */
const fmt=t=>{t=Math.max(0,t);return Math.floor(t/60)+":"+(t%60).toFixed(1).padStart(4,"0")};
const tl=document.getElementById("tl");
scenes.forEach((s,k)=>{const e=document.createElement("span");e.className=(k%2?"alt":"")+(SCENES[s.id]||screens.some(x=>x.scenes.includes(s)&&x.custom)?"":" miss");
  const nx=scenes[k+1]?scenes[k+1].enter:TOTAL;e.style.width=((nx-s.enter)/TOTAL*100)+"%";e.title=`${s.id} ${s.name}`;tl.insertBefore(e,document.getElementById("ph"))});

  document.getElementById("info").innerHTML=`<b>${esc(s.id)}</b> ${esc(s.name)}　${fmt(T)} / ${fmt(TOTAL)}`;
  document.getElementById("ph").style.left=(T/TOTAL*100)+"%";
  let ln=-1;for(const n in D.subs){const q=D.subs[n];if(T>=q[0]&&T<q[1]+.05){ln=+n;break}}
  const key=ln+"|"+s.id;if(key!==lastSub){lastSub=key;
    document.getElementById("sub").innerHTML=(ln>0?`<small>#${ln}　${fmt(D.subs[ln][0])}</small>${esc(D.subs[ln][2])}`:"<small>—</small>")+`<span class="prop">视觉命题：${esc(s.prop||"")}</span>`}
}
let playing=false,clock=null;
function seek(t){T=cl(t,0,TOTAL);if(au.readyState>0)au.currentTime=T;if(playing)clock={w:performance.now(),t:T};render()}
function play(){playing=true;document.getElementById("play").textContent="❚❚ 暂停";if(T>=TOTAL-.05)T=0;clock={w:performance.now(),t:T};
  try{au.currentTime=T;const pr=au.play();if(pr)pr.catch(()=>{})}catch(e){}requestAnimationFrame(tick)}
function pause(){playing=false;au.pause();document.getElementById("play").textContent="▶ 播放"}
function tick(){if(!playing)return;
  T=(!au.paused&&au.readyState>2&&Math.abs(au.currentTime-(clock.t+(performance.now()-clock.w)/1000))<.3)?au.currentTime:clock.t+(performance.now()-clock.w)/1000;
  if(T>=TOTAL){T=TOTAL;render();pause();return}render();requestAnimationFrame(tick)}
const jump=d=>{const s=sceneAt(T+.01),k=scenes.indexOf(s)+d;if(scenes[k])seek(Math.max(0,scenes[k].enter+.01))};
document.getElementById("play").onclick=()=>playing?pause():play();
document.getElementById("prev").onclick=()=>jump(-1);

document.addEventListener("keydown",e=>{
  if(e.code==="Space"){e.preventDefault();playing?pause():play()}
  else if(e.key==="ArrowRight"){e.preventDefault();jump(1)}
  else if(e.key==="ArrowLeft"){e.preventDefault();jump(-1)}

  window.__scenes=scenes.map((s,k)=>({id:s.id,name:s.name,enter:s.enter,t1:s.t1,exit:scenes[k+1]?scenes[k+1].enter:TOTAL,steps:s.steps}));
  window.__total=TOTAL;window.__size=[VW,VH];
